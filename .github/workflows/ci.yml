name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: salary
          POSTGRES_PASSWORD: salary
          POSTGRES_DB: salary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salary -d salary_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Integration tests migrate and use this database (see apps/api/vitest.config.mts).
      TEST_DATABASE_URL: postgresql://salary:salary@localhost:5432/salary_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build -w apps/api
